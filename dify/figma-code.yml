            \  \n3. 代码应包含必要的注释，帮助理解关键部分  \n4. 如果图片涉及动态交互，优先使用 React Hooks 进行实现  \n\
            5. 代码输出应格式化，符合业界最佳实践  \n6. 对应图片：{{#context#}}\n7. 不要使用任何组件库，只使用原生 HTML\
            \ 标签\n\n## Workflows  \n1. 解析图片内容，提取 UI 结构和交互元素  \n2. 设计组件层级，拆分为可复用的 React\
            \ 组件  \n3. 编写 JSX 结构，并结合 CSS 进行样式实现  \n4. 如果涉及交互，使用 React Hooks 编写逻辑 \
            \ \n5. 确保代码结构清晰，并输出完整的 React 代码  \n\n## OutputFormat  \n请按照以下格式输出代码： \
            \ \n```jsx\n// 组件名称: {ComponentName}\n// 功能描述: {描述组件的功能}\n\nimport React\
